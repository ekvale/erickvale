# HTTP server: after certbot has issued a certificate (see deploy/DEPLOYMENT.md),
# this block's only job is the ACME renewal passthrough and redirecting
# everything else to HTTPS. Before SSL is configured, certbot expects this
# block to exist and serve plain HTTP so it can complete the challenge.
server {
    listen 80;
    server_name erickvale.com www.erickvale.com 143.110.236.17;

    # Certbot HTTP-01 renewal challenge: must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else: send to HTTPS once a certificate exists.
    # (Before running certbot for the first time, comment this out and
    # temporarily proxy_pass to Django directly, the same as the HTTPS
    # block below, so the site is reachable while the cert is issued.)
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server: the real, current config once certbot has issued a cert.
server {
    listen 443 ssl http2;
    server_name erickvale.com www.erickvale.com;

    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/erickvale.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erickvale.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Headers Django's SecurityMiddleware already sets app-side (HSTS,
    # X-Frame-Options, X-Content-Type-Options: see erickvale/settings.py)
    # are deliberately NOT duplicated here to avoid conflicting/duplicate
    # response headers. Nginx adds the ones Django doesn't:
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compression: the single biggest easy win for page-load performance.
    # Covers HTML, the compiled Tailwind CSS, and every app's JS (including
    # math_bastion's canvas engine, which is a meaningfully sized text file).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    # Max upload size (for media files)
    client_max_body_size 10M;

    # Static files
    location /static/ {
        alias /home/erickvale/erickvale/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files
    location /media/ {
        alias /home/erickvale/erickvale/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # CKEditor uploads
    location /ckeditor/ {
        alias /home/erickvale/erickvale/staticfiles/ckeditor/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Django application
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
